<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Fest</title>

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="The Fest" />
    <meta property="og:description" content="The Fest" />
    <meta property="og:image" content="/images/fest-logo-transparent.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.thefestfl.com/" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: "#f8e7cb",
            },
          },
        },
      };
    </script>
    <style>
      body::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body class="bg-neutral-950 w-full min-h-screen relative overflow-x-hidden">
    <div
      class="relative z-10 flex flex-col items-center md:items-start gap-4 pt-8 px-4 md:px-8"
    >
      <div class="shrink-0 max-w-[300px] mx-auto">
        <img
          class="h-auto w-[250px] object-contain"
          src="images/fest-logo-transparent.png"
          alt="Fest Logo"
        />
      </div>
      <!-- Showspace Events Widget -->
      <script
        src="https://widget.showspace.org/widget.iife.js"
        data-showspace-customer="the-fest"
        data-showspace-container="showspace-widget"
        async
      ></script>
      <link rel="stylesheet" href="https://widget.showspace.org/widget.css" />
      <div
        id="showspace-widget"
        class="w-fit mx-auto md:flex-1 min-w-0 overflow-hidden"
      ></div>
    </div>
  </body>
</html>
